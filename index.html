<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
     <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>


    <div id="app">
        {{ message }}

        <p>Here are some artists:
            <li v-for = "artist in artists" :key="artist.name">
               {{artist.name}} {{artist.surname}} was born in {{artist.yearOfBirth}}.
            </li>
        </p>
    </div>
    
    <script type = "module">
            const { createApp } = Vue;
            createApp({
                data() {
                    return {
                        message: 'Hello Vue!',
                        artists: [
                            {
                                name: "Dave", 
                                surname: "Smith",
                                yearOfBirth: 1993
                            },
                            {
                                name: "Susan", 
                                surname: "Parker",
                                yearOfBirth: 1982
                            },
                        ]
                    }
                }
            }).mount('#app');
    </script>
</body>
</html>
