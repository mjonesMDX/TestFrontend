<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
     <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>


    <div id="app">
        {{ message }}

        <p>Here are some artists from the server:
            <li v-for = "artist in serverArtists" >
               {{artist.firstName}} {{artist.lastName}} was born in {{artist.yearOfBirth}}.
            </li>
        </p>
        <p>Here are some artists from the database:
            <li v-for = "artist in dbArtists" >
               {{artist.firstName}} {{artist.lastName}} was born in {{artist.yearOfBirth}}.
            </li>
        </p>
    </div>
    
    <script type = "module">
            const { createApp } = Vue;
            const myApp = createApp({
                data() {
                    return {
                        message: 'Hello Vue!',
                        serverArtists: [
                            {
                                firstName: "Dave", 
                                lastName: "Smith",
                                yearOfBirth: 1993
                            },
                            {
                                firstName: "Susan", 
                                lastName: "Parker",
                                yearOfBirth: 1982
                            },
                        ],
                        
                        dbArtists: [
                            {
                                firstName: "Dave", 
                                lastName: "Smith",
                                yearOfBirth: 1993
                            },
                            {
                                firstName: "Susan", 
                                lastName: "Parker",
                                yearOfBirth: 1982
                            },
                        ]
                    }
                },
                created: function(){
                    //nothing here yet
                    console.log("app created");
                    this.fetchData();
                   // this.artists = await fetch("http://localhost:4000/message").json();

                    this.message = "aha now the message is different";
                   // this.artists = [];
                },

                methods: {
                    async fetchData(){
                        const response = await fetch("http://localhost:4000/message");
                        const data = await response.json();
                        this.serverArtists = data;

                        const response2 = await fetch("http://localhost:4000/ping");
                        const data2 = await response2.json();
                        this.dbArtists = data2;
                    }
                }
            })
            
            myApp.mount('#app');
    </script>
</body>
</html>
